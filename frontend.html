const CORPUS=[
{id:1,type:'admit_card_date',exam:'EEA Entrance Exam',year:2026,title:'Notice: Admit card release schedule',url:'https://eea.example.gov/notices/ac-2026-01',domain:'eea.example.gov',org:'Example Exam Authority',pub:'2026-01-10',applies:'2026-01-22',excerpt:'Admit cards for the EEA Entrance Exam 2026 will be released on 22 January 2026.'},

{id:5,type:'cutoff',exam:'EEA Counselling',year:2026,round:1,course:'it',cat:'obc',val:84.2,title:'Round 1 closing percentiles 2026',url:'https://eea.example.gov/counselling/2026/r1-cutoff.pdf',domain:'eea.example.gov',org:'Example Exam Authority',pub:'2026-07-02',excerpt:'B.Tech IT, OBC category, Round 1 closing percentile: 84.2.'},
{id:6,type:'cutoff',exam:'EEA Counselling',year:2025,round:1,course:'it',cat:'general',val:95.2,title:'Round 1 closing percentiles 2025',url:'https://eea.example.gov/counselling/2025/r1-cutoff.pdf',domain:'eea.example.gov',org:'Example Exam Authority',pub:'2025-07-03',excerpt:'B.Tech IT, General category, Round 1 closing percentile: 95.2.'},
{id:7,type:'leak',exam:'EEA Entrance Exam',year:2026,title:'EEA statement on social media rumours',url:'https://eea.example.gov/press/rumours-2026',domain:'eea.example.gov',org:'Example Exam Authority',pub:'2026-01-30',excerpt:'The Authority is aware of messages on social media and is reviewing them. No finding has been announced.'}];

const MON=['january','february','march','april','may','june','july','august','september','october','november','december'];
function extract(text,yr,cat){const t=text.toLowerCase(),c={missing:[]};
 c.type=/leak|telegram|paper is out|available before/.test(t)?'leak':/cutoff|cut-off|percentile|closing/.test(t)?'cutoff':/admit|hall ticket|release|postpone/.test(t)?'admit_card_date':'unknown';
 c.exam=/counsel/.test(t)?'EEA Counselling':/eea/.test(t)?'EEA Entrance Exam':null;
 const y=yr||(t.match(/20\d\d/)||[])[0];c.year=y?+y:null;
 const dm=t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)/);
 c.date=dm&&c.year?`${c.year}-${String(MON.indexOf(dm[2])+1).padStart(2,'0')}-${dm[1].padStart(2,'0')}`:null;
 const pm=t.match(/(\d{2}(?:\.\d+)?)\s*(?:percentile|%)/);c.val=pm?+pm[1]:null;c.course=/\bit\b|information tech/.test(t)?'it':null;
 c.cat=(cat||(/obc/.test(t)?'OBC':/general/.test(t)?'General':'')).toLowerCase()||null;const rm=t.match(/round\s*(\d)/);c.round=rm?+rm[1]:null;
 if(!c.exam)c.missing.push('exam name');if(!c.year)c.missing.push('year');if(c.type==='unknown')c.missing.push('claim type');
 if(c.type==='admit_card_date'&&!c.date)c.missing.push('claimed date');

const discover=c=>CORPUS.filter(d=>d.type===c.type&&(d.exam===c.exam||!c.exam)).map(d=>({...d,fetched:new Date().toISOString(),official:OFFICIAL.includes(d.domain)}));
function decide(c,ev){const R={verdict:'Unverified',why:'',match:[],conflict:[],rel:{},limits:[],next:'Check the official exam portal or contact the exam authority.'};const off=ev.filter(e=>e.official);
 ev.filter(e=>!e.official).forEach(e=>{R.rel[e.id]='inconclusive';e.limit=`${e.domain} is not on the official allowlist; treated as a lead, not proof.`});
 if(c.missing.length){R.why=`Missing details: ${c.missing.join(', ')}. Add them and check again.`;R.limits.push('Essential fields missing, so no comparison was attempted.');return R}
 if(c.type==='leak'){off.forEach(e=>R.rel[e.id]='inconclusive');R.why='No reliable source confirms or denies this. Repeated posts are not evidence, and finding no notice does not prove the claim false.';R.limits.push('Public sources only; private groups are never accessed.');R.next='Do not forward or pay for “leaked” material. Wait for an official statement.';return R}
 if(c.type==='admit_card_date'){const s=off.filter(e=>e.year===c.year).sort((a,b)=>b.pub.localeCompare(a.pub));if(!s.length){R.why='No official notice found for this exam and year.';R.limits.push('Absence of a notice is not proof of falsity.');return R}
  const cur=s[0];s.forEach(e=>R.rel[e.id]=e===cur?(e.applies===c.date?'supports':'contradicts'):(e.applies===c.date?'contradicts':'inconclusive'));
  if(cur.applies===c.date){R.verdict='Verified';R.match.push(`Exam and year match (${cur.exam} ${cur.year})`,`Claimed date ${c.date} matches the latest official notice (published ${cur.pub})`);R.why='The latest official notice states the same release date.'}
  else{R.verdict='Likely False';R.conflict.push(`Claimed ${c.date}; latest official notice says ${cur.applies}`);const old=s.find(e=>e!==cur&&e.applies===c.date);
   if(old){R.conflict.push(`${c.date} appears only in an earlier notice (${old.pub}) superseded on ${cur.pub}`);R.why='The claimed date comes from an outdated notice that a later official notice replaced.'}else R.why='The latest official notice gives a different date.'}
  R.next='Confirm the date on the official admit-card portal.';return R}
 if(c.type==='cutoff'){const rows=off.filter(e=>e.course===c.course&&e.cat===c.cat&&e.round===c.round),same=rows.find(e=>e.year===c.year);rows.forEach(e=>R.rel[e.id]='inconclusive');

function bind(u,h){
 $$('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;route()});
 const cl=$('#cl');if(cl){cl.oninput=()=>$('#cn').textContent=cl.value.length+'/1000';
  $$('[data-x]').forEach(b=>b.onclick=()=>{const s=EX[b.dataset.x];cl.value=s[1];$('#yr').value=s[2];$('#ct').value=s[3];cl.oninput()});
  const fi=$('#fi');if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#pv').src=r.result;$('#pv').style.display='block'};r.readAsDataURL(f)};
  $('#vg').onclick=async()=>{const t=cl.value.trim();if(!t){cl.focus();return}const st=$('#st');
   for(const s of ['Extracting the claim…','Searching official sources…','Validating sources…','Comparing details…','Applying verdict rules…']){st.textContent=s;await sleep(320)}
   const note=tab==='link'?'Source link: '+($('#lk').value||'none given'):tab==='img'?'Submitted via screenshot (text typed by user)':'';location.hash='#/app/report/'+saveCheck(t,$('#yr').value.trim(),$('#ct').value,0,note).id}}
 $$('[data-ev]').forEach(b=>b.onclick=()=>{const k=checks().find(x=>x.id===p0());const e=k.ev[b.dataset.ev];modal(`<h3>${esc(e.title)}</h3><p class="note">${esc(e.org)} · ${esc(e.domain)} · published ${e.pub} · checked ${fmtT(e.fetched)}</p><p style="border-left:3px solid var(--line);padding-left:10px">${esc(e.excerpt)}</p><p class="note" style="word-break:break-all">${esc(e.url)} (synthetic sample)</p>${e.limit?`<p class="note">${esc(e.limit)}</p>`:''}`)});
 $$('[data-act]').forEach(b=>b.onclick=()=>{DB.set('checks',checks().map(k=>k.id===b.dataset.id?{...k,status:b.dataset.act,audit:[...k.audit,{t:Date.now(),w:'Reviewer '+u.name,a:b.dataset.act}]}:k));route()});
 $$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this analysis?')){DB.set('checks',checks().filter(k=>k.id!==b.dataset.del));location.hash='#/app/history'}});
 $$('[data-al]').forEach(b=>b.onclick=()=>{alTab=b.dataset.al;route()});$$('[data-sr]').forEach(b=>b.onclick=()=>{srTab=b.dataset.sr;route()});
 $$('[data-av]').forEach(b=>b.onclick=()=>{const a=ALERTS[b.dataset.av];modal(`<h3>${a[0]}</h3><p class="note">${a[1]} · synthetic sample alert</p><p>In the full build, alerts come from official notice pages collected by the research agent and link to the original notice.</p>`)});
 const ca=$('#ca');if(ca)ca.onclick=()=>modal('<h3>Customize alerts</h3><p>Choose exams and universities to follow. This needs the backend (saved preferences and notifications), so it is a placeholder in this prototype.</p>');
 if($('#hl')){const draw=()=>{const q=$('#hq').value.toLowerCase(),e=$('#he').value,r=$('#hr').value,t=+$('#ht').value;
   const a=checks().filter(k=>k.owner===u.email&&(!r||k.r.verdict===r)&&(!e||k.c.exam===e)&&(!t||Date.now()-k.ts<t*36e5)&&(k.text+(k.c.exam||'')).toLowerCase().includes(q));$('#hl').innerHTML=tbl(a);$('#ex').onclick=()=>modal(`<h3>Export (CSV)</h3><textarea readonly rows="8" id="cx">${esc(csv(a))}</textarea><p class="note">Select all and copy. File downloads need the real backend.</p>`)};
  ['hq','he','hr','ht'].forEach(i=>$('#'+i).oninput=draw);draw()}
 const gq=$('#gq');if(gq){const d=()=>{$('#gg').innerHTML=guideCards(gq.value.toLowerCase());$$('[data-g]').forEach(b=>b.onclick=()=>{const g=GUIDES[b.dataset.g];modal(`<h3>${g[0]}</h3><p>${g[3]}</p>`)})};gq.oninput=d;d()}
 const sv=$('#sv');if(sv){sv.onclick=()=>{DB.set('users',users().map(x=>x.email===u.email?{...x,name:$('#sn').value.trim()||x.name,role:$('#sr').value}:x));DB.set('theme',$('#th').value);applyTheme();$('#sm').textContent='Saved.'};
  $('#wipe').onclick=()=>{if(confirm('Delete all your analyses?')){DB.set('checks',checks().filter(k=>k.owner!==u.email));$('#sm').textContent='Analyses deleted.'}}}}
const p0=()=>location.hash.split('/')[3];
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
applyTheme();window.addEventListener('hashchange',route);route();
</script></body></html>
